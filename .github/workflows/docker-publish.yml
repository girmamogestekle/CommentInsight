name: Build & Push Docker Images

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  IMAGE_PREFIX: commentinsight

jobs:
  build-and-push:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: config-server
            dockerfile: config-server/Dockerfile
          - service: discovery-service
            dockerfile: discovery-service/Dockerfile
          - service: api-gateway-service
            dockerfile: api-gateway-service/Dockerfile
          - service: connector-service
            dockerfile: connector-service/Dockerfile
          - service: youtube-connector-service
            dockerfile: youtube-connector-service/Dockerfile
          - service: sentiment-service
            dockerfile: sentiment-service/Dockerfile

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4

      # ── 2. Set up Docker Buildx ───────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Log in to Docker Hub (skip on PRs) ─────────────────────────
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # ── 4. Derive image tags ──────────────────────────────────────────
      # develop  → :dev
      # main/master → :latest  +  :<short-sha>
      - name: Derive image tags
        id: tags
        run: |
          IMAGE="${{ env.IMAGE_PREFIX }}/${{ matrix.service }}"
          SHA="${GITHUB_SHA::7}"
          REF="${GITHUB_REF_NAME}"

          if [ "$REF" = "develop" ]; then
            echo "tags=${IMAGE}:dev" >> "$GITHUB_OUTPUT"
          elif [ "$REF" = "main" ] || [ "$REF" = "master" ]; then
            echo "tags=${IMAGE}:latest,${IMAGE}:${SHA}" >> "$GITHUB_OUTPUT"
          else
            # PRs or other branches — build only, no push
            echo "tags=${IMAGE}:pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
          fi

      # ── 5. Build & push ───────────────────────────────────────────────
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          # Cache layers in GitHub Actions cache for faster rebuilds
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
