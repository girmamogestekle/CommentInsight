name: Build & Push Docker Images

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  IMAGE_NAME: commentinsight
  DOPPLER_TOKEN: ${{ secrets.COMMENTINSIGHT_DOPPLER_TOKEN }}

jobs:
  build-and-push:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: config-server
            dockerfile: config-server/Dockerfile
          - service: discovery-service
            dockerfile: discovery-service/Dockerfile
          - service: api-gateway-service
            dockerfile: api-gateway-service/Dockerfile
          - service: connector-service
            dockerfile: connector-service/Dockerfile
          - service: youtube-connector-service
            dockerfile: youtube-connector-service/Dockerfile
          - service: sentiment-service
            dockerfile: sentiment-service/Dockerfile

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Load secrets from Doppler
        run: |
          if [ -z "$DOPPLER_TOKEN" ]; then
            echo "::error::DOPPLER_TOKEN is missing. Add it under GitHub → Settings → Secrets → Actions."
            exit 1
          fi
          # Inject Doppler secrets into subsequent steps (includes DOCKER_HUB_*)
          doppler secrets download --no-file --format env >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      # Single Docker Hub repo: <user>/commentinsight
      # One tag per service, matching docker-compose.yml (e.g. config-server-dev)
      - name: Derive image tags
        id: tags
        run: |
          if [ -z "$DOCKER_HUB_USERNAME" ] || [ -z "$DOCKER_HUB_TOKEN" ]; then
            echo "::error::DOCKER_HUB_USERNAME / DOCKER_HUB_TOKEN missing in Doppler (project commentinsight / config from service token)."
            exit 1
          fi

          IMAGE="${DOCKER_HUB_USERNAME}/${{ env.IMAGE_NAME }}"
          SERVICE="${{ matrix.service }}"
          echo "tags=${IMAGE}:${SERVICE}-dev" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
