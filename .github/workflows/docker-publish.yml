name: Build & Push Docker Images

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  IMAGE_NAME: commentinsight
  DOPPLER_TOKEN: ${{ secrets.COMMENTINSIGHT_DOPPLER_TOKEN }}

jobs:
  build-and-push:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: config-server
            dockerfile: config-server/Dockerfile
          - service: discovery-service
            dockerfile: discovery-service/Dockerfile
          - service: api-gateway-service
            dockerfile: api-gateway-service/Dockerfile
          - service: connector-service
            dockerfile: connector-service/Dockerfile
          - service: youtube-connector-service
            dockerfile: youtube-connector-service/Dockerfile
          - service: sentiment-service
            dockerfile: sentiment-service/Dockerfile

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Load Docker Hub credentials from Doppler
        id: hub
        run: |
          if [ -z "$DOPPLER_TOKEN" ]; then
            echo "::error::COMMENTINSIGHT_DOPPLER_TOKEN is missing in GitHub Actions secrets."
            exit 1
          fi

          USERNAME="$(doppler secrets get DOCKER_HUB_USERNAME --plain | tr -d '\r\n')"
          TOKEN="$(doppler secrets get DOCKER_HUB_TOKEN --plain | tr -d '\r\n')"

          if [ -z "$USERNAME" ] || [ -z "$TOKEN" ]; then
            echo "::error::DOCKER_HUB_USERNAME or DOCKER_HUB_TOKEN missing/empty in Doppler."
            exit 1
          fi

          echo "::add-mask::$USERNAME"
          echo "::add-mask::$TOKEN"
          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"
          {
            echo "token<<EOF"
            echo "$TOKEN"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ steps.hub.outputs.username }}
          password: ${{ steps.hub.outputs.token }}

      - name: Derive image tags
        id: tags
        run: |
          IMAGE="${{ steps.hub.outputs.username }}/${{ env.IMAGE_NAME }}"
          SERVICE="${{ matrix.service }}"
          echo "tags=${IMAGE}:${SERVICE}-dev" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
