name: Build & Push Docker Images

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  # Docker Hub username (e.g. girmamogestekle) — images go to <user>/commentinsight:<tag>
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  IMAGE_NAME: commentinsight

jobs:
  build-and-push:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: config-server
            dockerfile: config-server/Dockerfile
          - service: discovery-service
            dockerfile: discovery-service/Dockerfile
          - service: api-gateway-service
            dockerfile: api-gateway-service/Dockerfile
          - service: connector-service
            dockerfile: connector-service/Dockerfile
          - service: youtube-connector-service
            dockerfile: youtube-connector-service/Dockerfile
          - service: sentiment-service
            dockerfile: sentiment-service/Dockerfile

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # Single Docker Hub repo: <user>/commentinsight
      # One tag per service, matching docker-compose.yml (e.g. config-server-dev)
      - name: Derive image tags
        id: tags
        run: |
          IMAGE="${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          SERVICE="${{ matrix.service }}"

          if [ -z "${{ env.DOCKER_HUB_USERNAME }}" ]; then
            echo "::error::DOCKER_HUB_USERNAME secret is empty. Add it under Settings → Secrets → Actions."
            exit 1
          fi

          echo "tags=${IMAGE}:${SERVICE}-dev" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
