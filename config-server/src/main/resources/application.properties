# ===============================
# Application Info
# ===============================
server.port=${SERVER_PORT:8888}
spring.application.name=config-server



# ===============================
# Configuration Server Info
# ===============================
spring.cloud.config.server.git.uri=${CONFIG_REPO_URL:}
spring.cloud.config.server.git.default-label=${CONFIG_REPO_BRANCH:main}
spring.cloud.config.server.git.username=${CONFIG_REPO_USERNAME:}
spring.cloud.config.server.git.password=${CONFIG_REPO_TOKEN:}
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.search-paths=application,discovery-service,api-gateway-service,connector-service,youtube-connector-service,sentiment-service


# ===============================
# Eureka Registration
# Config-server registers itself so it appears in the Eureka dashboard.
# It retries until discovery-service is up (fetch-registry=false avoids
# using Eureka for its own config lookups, preventing a circular dependency).
# ===============================
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.fetch-registry=false
eureka.instance.prefer-ip-address=true



# ===============================
# Management Health Endpoints
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always