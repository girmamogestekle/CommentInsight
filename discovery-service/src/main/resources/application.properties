# ===============================
# Bootstrap — loaded before config server
# All other config comes from the config-server (comment-insight-config repo)
# ===============================
spring.application.name=discovery-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://config-server:8888}

# Eureka server does not register with itself or fetch from itself
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.server.wait-time-in-ms-when-sync-empty=0
