# ===============================
# Bootstrap — loaded before config server
# All other config comes from the config-server (comment-insight-config repo)
# ===============================
spring.application.name=sentiment-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://config-server:8888}

# OpenAI API key injected at runtime (never stored in config repo)
spring.ai.openai.api-key=${OPENAI_API_KEY}
